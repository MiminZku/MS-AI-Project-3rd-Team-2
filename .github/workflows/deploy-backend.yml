name: deploy-backend

# backend/ 폴더에 변경이 생길 때만 작동
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: # 수동 배포 버튼 활성화

permissions:
  contents: read
  id-token: write # azure/login OIDC 권한 (필수)

env:
  IMAGE_NAME: interview-backend
  ACR_NAME: team2container # 💡 본인의 ACR 이름으로 확인 후 수정 (예: team2container)
  CONTAINER_APP_NAME: team2containerapp # 💡 Azure에 생성한 컨테이너 앱 이름
  AZURE_RESOURCE_GROUP: project-3rd-team-2 # 💡 리소스 그룹 이름

jobs:
  deploy:
    name: 빌드 & 배포
    runs-on: ubuntu-latest
    steps:
      - name: 리포지토리 코드 체크아웃
        uses: actions/checkout@v4

      # 🚨 주의: 이 스텝이 성공하려면 GitHub Secrets에 3개의 키가 등록되어 있어야 합니다!
      - name: Azure 로그인
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR 이미지 빌드 (Azure 원격 빌드)
        run: |
          az acr build \
            --registry "${{ env.ACR_NAME }}" \
            --image "${{ env.IMAGE_NAME }}:${GITHUB_SHA}" \
            --image "${{ env.IMAGE_NAME }}:latest" \
            --file backend/Dockerfile \
            backend

      - name: Container Apps 배포 (최신 이미지로 업데이트)
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${GITHUB_SHA}"

      - name: 배포 상태 확인 (Health Check)
        run: |
          FQDN=$(az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          
          # 💡 루트(/)는 라우트가 없어 404가 나므로 /health로 확인
          echo "Test URL: https://${FQDN}/health"
          for i in $(seq 1 10); do
            if curl -fsS "https://${FQDN}/health"; then exit 0; fi
            echo "재시도 ${i}/10"; sleep 10
          done
          echo "헬스체크 실패"; exit 1