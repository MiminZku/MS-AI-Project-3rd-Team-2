name: deploy-frontend-dashboard

# 참관자 대시보드 -> 별도 Static Web App. 인터뷰이가 URL로 접근하면 안 되므로 앱 자체를 분리한다.
on:
  push:
    branches: [main]
    paths:
      - "frontend/dashboard/**"
      - ".github/workflows/deploy-frontend-dashboard.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "frontend/dashboard/**"
      - ".github/workflows/deploy-frontend-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    name: 빌드 & 배포
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/dashboard/package-lock.json

      - name: 의존성 설치
        working-directory: frontend/dashboard
        run: npm ci

      - name: 빌드
        working-directory: frontend/dashboard
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_WS_BASE_URL: ${{ vars.VITE_WS_BASE_URL }}
          # 데모용 토큰. 번들에 노출되므로 진짜 인증은 SWA Entra ID 인증으로 대체할 것.
          VITE_ADMIN_TOKEN: ${{ secrets.DEMO_ADMIN_TOKEN }}
        run: npm run build

      - name: Static Web Apps 배포
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_DASHBOARD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dashboard
          output_location: dist
          skip_app_build: true

  close_pull_request:
    name: PR 미리보기 정리
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_DASHBOARD }}
          action: close
