name: deploy-frontend-interviewee

# 인터뷰이 웹 -> 전용 Static Web App (참관자 대시보드와 분리 배포, D10)
on:
  push:
    branches: [main]
    paths:
      - "frontend/interviewee/**"
      - ".github/workflows/deploy-frontend-interviewee.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "frontend/interviewee/**"
      - ".github/workflows/deploy-frontend-interviewee.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # PR 미리보기 환경 코멘트

jobs:
  build_and_deploy:
    name: 빌드 & 배포
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/interviewee/package-lock.json

      - name: 의존성 설치
        working-directory: frontend/interviewee
        run: npm ci

      - name: 빌드
        working-directory: frontend/interviewee
        # VITE_* 값은 번들에 그대로 박히므로 비밀값을 넣지 말 것 (리포지토리 Variables 사용)
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_WS_BASE_URL: ${{ vars.VITE_WS_BASE_URL }}
        run: npm run build

      - name: Static Web Apps 배포
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_INTERVIEWEE }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/interviewee
          output_location: dist
          skip_app_build: true # 위에서 이미 빌드함

  close_pull_request:
    name: PR 미리보기 정리
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_TOKEN_INTERVIEWEE }}
          action: close
